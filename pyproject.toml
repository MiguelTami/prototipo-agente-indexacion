[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indexador-catalogo"
version = "0.1.0"
description = "Prototipo aislado del agente de indexación (Agente A) de Learning Catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = [
    "langchain-aws>=0.2",
]
gemini = [
    "langchain-google-genai>=4.0",
]
dev = [
    "pytest>=8.0",
]
notebook = [
    "jupyterlab>=4.1",
]

[project.scripts]
indexador = "indexador.__main__:main"

[tool.setuptools.packages.find]
include = ["indexador*"]

[tool.setuptools.package-data]
indexador = ["config.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
