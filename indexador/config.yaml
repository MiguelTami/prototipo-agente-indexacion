# Configuración por defecto del agente. Se puede reemplazar pasando otro archivo a indexar().

# Versión del agente: va en Provenance.agentIdentifier y en el reporte.
agentVersion: "indexador-catalogo@0.1.0"

# Taxonomía y prompts vigentes: va en Provenance.configVersion. Si cambia, las comparaciones
# entre corridas dejan de ser válidas (CLAUDE.md, sección 3.6).
configVersion: "bloom-revisada@1;prompts@1"

llm:
  # "simulado": modelo falso y determinista, sin red ni credenciales (pruebas).
  # "bedrock": Amazon Bedrock, el mismo proveedor que usa Yupi.
  # "gemini": Gemini en Google AI Studio; la llave va en GOOGLE_API_KEY (ver .env.example).
  modo: "simulado"
  # Id del modelo, obligatorio en modo "bedrock" o "gemini". Debe soportar salida estructurada.
  modelo: null
  region: "sa-east-1"
  temperatura: 0.0
  # Reintentos además del primer intento; si se agotan, el contenido sale como ilegible.
  reintentos: 2
  # Espera antes del primer reintento, en segundos; se duplica en cada reintento.
  esperaReintentoSegundos: 0
  # Contenidos procesados a la vez. Bájalo si el proveedor responde con límite de solicitudes.
  maxConcurrencia: 4
  # Tope de caracteres del markdown que se envía al modelo.
  maxCaracteresEntrada: 60000

umbrales:
  # Menos caracteres útiles que esto, sin contar encabezados de página, es un archivo ilegible.
  minCaracteresUtiles: 100
